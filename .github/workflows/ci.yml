name: Dart CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6
        ports:
          - 27017:27017
        options: >-
          --tmpfs /data/db
          --health-cmd "mongosh --eval 'db.runCommand({ping: 1})'"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Install Melos
        run: dart pub global activate melos

      - name: Get dependencies
        run: dart pub get

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Analyze project source
        run: dart analyze

      - name: Wait for MongoDB
        run: |
          echo "Waiting for MongoDB to be ready..."
          for i in {1..30}; do
            if mongosh --eval "db.runCommand({ping: 1})" > /dev/null 2>&1; then
              echo "MongoDB is ready!"
              break
            fi
            echo "Waiting for MongoDB... attempt $i/30"
            sleep 2
          done

      - name: Run tests
        run: melos run test
        env:
          MONGO_DB_URI: mongodb://localhost:27017/local

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloud Build Deployment
        run: |
          curl -X POST "${{ secrets.CLOUD_WEBHOOK_URL }}&secret=${{ secrets.WEEBI_SERVER_PRD_DEPLOYMENT_TRIGGER }}" \
                -H "Content-Type: application/json" \
                -d '{
                  "branchName": "${{ github.ref_name }}",
                  "commitSha": "${{ github.sha }}"
                }'
